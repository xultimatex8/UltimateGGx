<form [formGroup]="searchService.form" (ngSubmit)="searchService.searchSummoner()">
  <div class="flex gap-2">
    <input
      type="text"
      formControlName="username"
      placeholder="Summoner name"
      class="w-40 h-9 sm:flex-1 bg-background border border-border rounded px-3 py-1.5 text-xs sm:text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent"
    />

    <span class="flex items-center px-1 text-text-muted text-sm">#</span>

    <input
      type="text"
      formControlName="tag"
      placeholder="TAG"
      class="w-16 bg-background border border-border rounded px-2 py-1.5 text-xs sm:text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent"
    />

    <button
      type="submit"
      [disabled]="searchService.form.invalid"
      class="bg-accent-dark hover:bg-accent disabled:opacity-50 disabled:cursor-auto disabled:hover:bg-accent-dark text-text-primary text-xs sm:text-sm font-medium px-4 py-1.5 rounded transition shrink-0 cursor-pointer"
    >
      Search
    </button>
  </div>
</form>
