name: CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  check-cis:
    name: Check Backend CI and Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Check CI results
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          workflows=("backend-ci.yml" "frontend-ci.yml")

          for workflow in "${workflows[@]}"; do
            echo "Checking $workflow..."

            set +e
            run=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow="$workflow" \
              --commit="$SHA" \
              --limit=1 \
              --json status,conclusion \
              --jq '.[0]' 2>/dev/null)
            exit_code=$?
            set -e

            if [ $exit_code -ne 0 ] || [ -z "$run" ]; then
              echo "$workflow was not executed. Skipping."
              continue
            fi

            status=$(echo "$run" | jq -r '.status')
            conclusion=$(echo "$run" | jq -r '.conclusion')

            echo "$workflow: status=$status conclusion=$conclusion"

            if [ "$status" != "completed" ]; then
              echo "$workflow is still running. Waiting..."

              for i in {1..60}; do
                sleep 10

                run=$(gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow="$workflow" \
                  --commit="$SHA" \
                  --limit=1 \
                  --json status,conclusion \
                  --jq '.[0]' 2>/dev/null)

                status=$(echo "$run" | jq -r '.status')
                conclusion=$(echo "$run" | jq -r '.conclusion')

                echo "$workflow: status=$status conclusion=$conclusion"

                if [ "$status" = "completed" ]; then
                  break
                fi
              done
            fi

            if [ "$status" != "completed" ]; then
              echo "$workflow did not finish in time."
              exit 1
            fi

            if [ "$conclusion" = "success" ]; then
              echo "$workflow passed."
            else
              echo "$workflow failed with conclusion: $conclusion"
              exit 1
            fi
          done

          echo "All applicable CIs passed."