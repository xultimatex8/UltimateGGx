<div class="bg-linear-to-b from-hero to-background border-b border-border">
  <div class="max-w-5xl mx-auto px-6 py-16 text-center">
    <h1 class="text-3xl font-bold text-text-primary mb-2 tracking-tight">
      Ultimate<span class="text-accent">GGx</span>
    </h1>

    <p class="text-text-secondary text-sm mb-8">
      Search a summoner to view match history and match data and timelines
    </p>

    <form [formGroup]="searchService.form" (ngSubmit)="searchService.searchSummoner()" class="max-w-md mx-auto">
      <div class="flex gap-2">
        <input
          type="text"
          formControlName="username"
          placeholder="Summoner name"
          class="flex-1 bg-surface border border-border rounded px-4 py-2.5 text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent"
        />

        <span class="flex items-center px-1 text-text-muted text-sm">#</span>

        <input
          type="text"
          formControlName="tag"
          placeholder="TAG"
          class="w-20 bg-surface border border-border rounded px-3 py-2.5 text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent"
        />
      </div>

      <button
        type="submit"
        class="mt-4 w-full bg-accent-dark hover:bg-accent disabled:opacity-50 text-text-primary text-sm font-medium py-2.5 rounded transition cursor-pointer"
      >
        Search
      </button>
    </form>
  </div>
</div>
