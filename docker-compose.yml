services:
  postgres:
    image: postgres:16
    container_name: ultimateggx-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ultimateggx-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      - postgres
    expose:
      - "8080"

  frontend:
    build: ./frontend
    container_name: ultimateggx-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: